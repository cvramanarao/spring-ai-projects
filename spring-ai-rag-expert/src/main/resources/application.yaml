spring:
  application:
    name: spring-ai-rag-expert
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        model: text-embedding-3-small
      chat:
        model: gpt-4o-mini
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
          username: root
          password: milvus
        database-name: default
        collection-name: vector_store
        embedding-dimension: 1536
        index-type: ivf_flat
        metric-type: cosine
        initialize-schema: true
